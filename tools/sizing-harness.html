<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
<style>
  html,body{margin:0;background:#111;font:12px monospace;color:#ddd}
  /* replica of the game wrapper: ui/modules/apps/bng-app.html + main.css */
  .bng-app{position:relative;overflow:hidden;margin:14px 0}
  .bngApp{box-sizing:border-box;padding:2px}
  #out{white-space:pre;color:#8f8;font-size:13px}
</style></head><body>
<div id="stage"></div><pre id="out">measuring...</pre>
<script>
window.bngApi={engineLua:function(){},activeObjectLua:function(){}};
window.StreamsManager={add:function(){},remove:function(){}};
angular.module('beamng.apps',[]);
var OPMODE = /[?&]op(=|&|$)/.test(location.search);  // must not match '?pop'
// ?op = the HUD-opacity sweep: one size, four alpha values, over a bright
// backdrop. That is the only way to see whether the shadows and the accent
// fills actually track --bt-a, since at 72% on black they look identical.
var SIZES = OPMODE ? [[764,223],[764,223],[764,223],[764,223]]
                   : [[382,111.5],[764,223],[982,286.6],[1152,336.3]];
var OPS = [0, 35, 72, 100];
var TAB = (/[?&]tab=([a-z]+)/.exec(location.search) || [])[1];
// ?shot= is the README-screenshot mode: one app, 1000x292 (the locked
// 3.4260:1 aspect), neutral backdrop so the translucency is visible, and no
// harness chrome in frame. Pair it with --force-device-scale-factor=2.
var SHOT = (/[?&]shot=([a-z]+)/.exec(location.search) || [])[1];
if (SHOT) { TAB = SHOT; SIZES = [[1000,292]]; }
else if (TAB) SIZES = [[764,223]];
if (SHOT) {
  var st=document.createElement('style');
  // Must beat the harness's own body{background:#111} -- the HUD is
  // translucent, so a screenshot on flat black would misrepresent it.
  st.textContent='body{margin:0;padding:18px;'
    +'background:linear-gradient(160deg,#33404e 0%,#4a5a68 40%,#6b7885 70%,#8a9099 100%)}'
    +'#out{display:none}.bng-app{margin:0}';
  document.head.appendChild(st);
}
if (OPMODE) document.body.style.background =
  'repeating-linear-gradient(45deg,#c8d8e8 0 40px,#e8d8c0 40px 80px)';
var stage=document.getElementById('stage');
SIZES.forEach(function(sz,i){
  var w=document.createElement('div');
  w.className='bng-app'; w.style.width=sz[0]+'px'; w.style.height=sz[1]+'px';
  w.innerHTML='<div class="ngt" style="width:100%;height:100%;box-sizing:border-box"><div brake-test></div></div>';
  w.setAttribute('data-sz', OPMODE ? ('opacity '+OPS[i]+'%') : (sz[0]+'x'+sz[1]));
  stage.appendChild(w);
});
</script>
<script src="/ui/modules/apps/BrakeTest/app.js"></script>
<script>
// Bootstrap each box SEPARATELY. The directive deliberately declares no
// isolate scope, so one bootstrap over the whole stage would hand all four
// instances a single shared scope and per-box opacity could not be tested --
// every box would show whichever value was written last.
document.querySelectorAll('.bng-app').forEach(function(box){
  angular.bootstrap(box, ['beamng.apps']);
});
var POP = /[?&]pop(=|&|$)/.test(location.search);
setTimeout(function(){
  if(POP||OPMODE||TAB||SHOT){
    document.querySelectorAll('.brakeTestRoot').forEach(function(r,i){
      var s=angular.element(r).scope();
      s.$apply(function(){
        if(OPMODE) s.hudOpacity=OPS[i];
        if(TAB){
          s.activeTab=TAB;
          s.data.turning_enabled=true;
          s.data.avg_steer_input='0.42'; s.data.achieved_yaw='18.7'; s.data.acs_score='87.4';
          s.data.dist_m='37.91'; s.data.arc_dist_ft='127.6'; s.data.duration_s='2.71';
          s.data.car='etk 800-Series'; s.data.time_str='14:22:07';
          s.data.bf_avg={FL:'1842',FR:'1839',RL:'1104',RR:'1101'};
          s.data.bf_max={FL:'2410',FR:'2402',RL:'1466',RR:'1460'};
          s.data.bf_min={FL:'0',FR:'0',RL:'0',RR:'0'};
          s.data.torque_fl_path='M 0 19 L 12 4 L 40 3 L 70 5 L 100 17';
          s.data.torque_fr_path='M 0 19 L 12 5 L 40 3 L 70 6 L 100 17';
          s.data.torque_rl_path='M 0 19 L 14 8 L 42 7 L 72 9 L 100 18';
          s.data.torque_rr_path='M 0 19 L 14 8 L 42 7 L 72 9 L 100 18';
          s.btInputBrakeMph=60; s.btInputRecordMph=60; s.btInputCoastMph=2;
          s.btEnableTurning=true; s.btInputSteerAmt=0.4; s.btSteerAtMode='record';
          s.btAutoTest=true; s.btInputTelemetryHz=200;
          // 25 rows is the Show-last ceiling, so this is the worst case the
          // frozen header has to survive.
          s.historyRows=[];
          for(var k=0;k<25;k++) s.historyRows.push({
            car:'etk800', from:'60.0', dist:(37+k*0.11).toFixed(2),
            g:(1.02-k*0.003).toFixed(3), time:'12:0'+(k%10), isBest:k===7});
        }
        s.data.arc_dist_m='38.42'; s.data.avg_g='1.043'; s.data.avg_wheel_angle='12.4';
        s.data.understeer='3.1'; s.data.actual_start_mph='60.1';
        s.data.decel_path='M 0 18 L 20 6 L 50 4 L 80 7 L 100 16';
      });
    });
  }
  // Scroll History so the frozen header is actually put under load -- an
  // un-scrolled list proves nothing about position:sticky.
  // &sc=<px> scrolls the secondary tabs, so a screenshot can show content
  // that lives below the fold (Details' brake-torque grid, History's rows
  // under the frozen header).
  var SC = parseInt((/[?&]sc=(\d+)/.exec(location.search)||[])[1], 10);
  if(TAB==='history' && isNaN(SC)) SC=180;
  if(!isNaN(SC)) setTimeout(function(){
    document.querySelectorAll('.btScroll').forEach(function(sc){ sc.scrollTop=SC; });
  },200);
  setTimeout(measure,400);
},400);
function outer(el){var c=getComputedStyle(el);return el.offsetHeight+parseFloat(c.marginTop)+parseFloat(c.marginBottom);}
function measure(){
  var lines=['MODE: '+(POP?'populated (after a run)':'empty (no run yet)'),''];
  document.querySelectorAll('.bng-app').forEach(function(box){
    var root=box.querySelector('.brakeTestRoot');
    var nav=box.querySelector('.btNav');
    lines.push('--- '+box.getAttribute('data-sz')+'  (root '+root.offsetWidth+'x'+root.offsetHeight+') ---');
    // Main must never scroll or clip: .btMainBody has no overflow-y:auto, so
    // anything too tall is silently cut off by the root's overflow:hidden
    // rather than becoming a scrollbar. scrollHeight vs clientHeight is the
    // only honest test -- a fill % under 100 does not prove it fits.
    var clipped=[];
    box.querySelectorAll('.btMainBody, .btWidgets, .btWidgets .btTile, .btNav').forEach(function(el){
      var dv=el.scrollHeight-el.clientHeight, dh=el.scrollWidth-el.clientWidth;
      if(dv>1||dh>1) clipped.push((el.className.split(' ')[0]||el.tagName)+' +'+dv+'v/+'+dh+'h');
    });
    lines.push('  MAIN CLIPPING: '+(clipped.length?('*** '+clipped.join(', ')):'none'));
    lines.push('  --bt-a = '+(getComputedStyle(root).getPropertyValue('--bt-a')||'(unset)').trim());
    lines.push('  nav flush gap: '+(root.getBoundingClientRect().bottom-nav.getBoundingClientRect().bottom).toFixed(2)+'px  (want ~1)');
    box.querySelectorAll('.btWidgets .btTile').forEach(function(t){
      var cs=getComputedStyle(t);
      var inner=t.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
      var sum=0,n=0;
      Array.prototype.forEach.call(t.children,function(ch){
        if(getComputedStyle(ch).position==='absolute')return;
        sum+=outer(ch); n++;
      });
      var name=(t.querySelector('.btTileLabel')||{textContent:'?'}).textContent.trim();
      var over = sum>inner+0.5 ? '  OVERFLOW' : '';
      var tb=t.getBoundingClientRect(), kids=[];
      Array.prototype.forEach.call(t.children,function(ch){
        if(getComputedStyle(ch).position==='absolute')return; kids.push(ch.getBoundingClientRect());});
      var top=kids[0].top-(tb.top+parseFloat(cs.paddingTop));
      var bot=(tb.bottom-parseFloat(cs.paddingBottom))-kids[kids.length-1].bottom;
      var gaps=[]; for(var i=1;i<kids.length;i++) gaps.push((kids[i].top-kids[i-1].bottom).toFixed(1));
      lines.push('  '+(name+'                    ').slice(0,20)+' children='+n+
        '  fill='+(100*sum/inner).toFixed(0)+'%  DEAD-BOTTOM='+bot.toFixed(1)+'px'+
        '  top='+top.toFixed(1)+'  gaps=['+gaps.join(', ')+']'+over);
    });
    lines.push('');
  });
  document.getElementById('out').textContent=lines.join('\n');
}
</script></body></html>

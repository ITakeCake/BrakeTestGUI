  var lines=['MODE: '+(POP?'populated (after a run)':'empty (no run yet)'),''];
  document.querySelectorAll('.bng-app').forEach(function(box){
    var root=box.querySelector('.brakeTestRoot');
    var nav=box.querySelector('.btNav');
    lines.push('--- '+box.getAttribute('data-sz')+'  (root '+root.offsetWidth+'x'+root.offsetHeight+') ---');
    // Main must never scroll or clip: .btMainBody has no overflow-y:auto, so
    // anything too tall is silently cut off by the root's overflow:hidden
    // rather than becoming a scrollbar. scrollHeight vs clientHeight is the
    // only honest test -- a fill % under 100 does not prove it fits.
    var clipped=[];
    box.querySelectorAll('.btMainBody, .btWidgets, .btWidgets .btTile, .btNav').forEach(function(el){
      var dv=el.scrollHeight-el.clientHeight, dh=el.scrollWidth-el.clientWidth;
      if(dv>1||dh>1) clipped.push((el.className.split(' ')[0]||el.tagName)+' +'+dv+'v/+'+dh+'h');
    });
    lines.push('  MAIN CLIPPING: '+(clipped.length?('*** '+clipped.join(', ')):'none'));
    lines.push('  --bt-a = '+(getComputedStyle(root).getPropertyValue('--bt-a')||'(unset)').trim());
    lines.push('  nav flush gap: '+(root.getBoundingClientRect().bottom-nav.getBoundingClientRect().bottom).toFixed(2)+'px  (want ~1)');
    box.querySelectorAll('.btWidgets .btTile').forEach(function(t){
      var cs=getComputedStyle(t);
      var inner=t.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
      var sum=0,n=0;
      Array.prototype.forEach.call(t.children,function(ch){
        if(getComputedStyle(ch).position==='absolute')return;
        sum+=outer(ch); n++;
      });
      var name=(t.querySelector('.btTileLabel')||{textContent:'?'}).textContent.trim();
      var over = sum>inner+0.5 ? '  OVERFLOW' : '';
      var tb=t.getBoundingClientRect(), kids=[];
      Array.prototype.forEach.call(t.children,function(ch){
        if(getComputedStyle(ch).position==='absolute')return; kids.push(ch.getBoundingClientRect());});
      var top=kids[0].top-(tb.top+parseFloat(cs.paddingTop));
      var bot=(tb.bottom-parseFloat(cs.paddingBottom))-kids[kids.length-1].bottom;
      var gaps=[]; for(var i=1;i<kids.length;i++) gaps.push((kids[i].top-kids[i-1].bottom).toFixed(1));
      lines.push('  '+(name+'                    ').slice(0,20)+' children='+n+
        '  fill='+(100*sum/inner).toFixed(0)+'%  DEAD-BOTTOM='+bot.toFixed(1)+'px'+
        '  top='+top.toFixed(1)+'  gaps=['+gaps.join(', ')+']'+over);
    });
    lines.push('');
  });
  document.getElementById('out').textContent=lines.join('\n');
}
</script></body></html>
